<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <title>FreshPoint × Instacart · delivery cost estimator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --fp: #164a38;
      --fp-deep: #0c2c21;
      --ic: #0aad0a;
      --paper: #f4efe6;
      --ink: #132119;
      --muted: #5a6a62;
      --card: #fffdf8;
      --line: #d8cebe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      background: linear-gradient(160deg, var(--fp-deep) 0%, var(--fp) 70%);
      color: #f6f3ec;
      padding: 1.35rem 1.25rem 1.5rem;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    .lockup {
      display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap;
      font-size: .78rem; letter-spacing: .12em; text-transform: uppercase;
      opacity: .85;
    }
    .lockup b { color: var(--ic); font-weight: 700; }
    h1 {
      margin: .45rem 0 0;
      font-size: clamp(1.45rem, 3.4vw, 2.05rem);
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .lede { margin: .45rem 0 0; max-width: 42rem; color: #d7e4dc; font-size: .95rem; }
    main { padding: 1.15rem 1.25rem 2.5rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 860px) {
      .grid { grid-template-columns: 1.05fr .95fr; align-items: start; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.05rem 1.1rem 1.15rem;
    }
    label { display: block; font-size: .78rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: .35rem; }
    select, input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      border: 1px solid #cfc6b6;
      border-radius: 10px;
      padding: .7rem .8rem;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    select:focus, input:focus { outline: 2px solid var(--ic); outline-offset: 1px; }
    .hint { font-size: .82rem; color: var(--muted); margin: .35rem 0 0; }
    .field { margin-bottom: .95rem; position: relative; }
    .suggest {
      position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% - 2px);
      background: #fff; border: 1px solid var(--line); border-radius: 0 0 10px 10px;
      max-height: 220px; overflow: auto; display: none;
    }
    .suggest button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: .65rem .8rem; font: inherit; cursor: pointer; border-top: 1px solid #eee8dc;
    }
    .suggest button:hover, .suggest button:focus { background: #f3f8f2; }
    #map { height: 280px; border-radius: 10px; border: 1px solid var(--line); margin-top: .2rem; }
    .quote-amt {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 700; letter-spacing: -.04em; line-height: 1;
      color: var(--fp-deep);
    }
    .quote-amt small { font-size: .38em; font-weight: 600; letter-spacing: 0; color: var(--muted); }
    .rows { margin-top: 1rem; border-top: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid #eee8dc; font-size: .95rem; }
    .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pill {
      display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; padding: .18rem .45rem; border-radius: 999px;
    }
    .live { background: #d8f5d8; color: #0a5c16; }
    .launching { background: #ffe7b8; color: #7a4a00; }
    .expansion { background: #e6e3db; color: #3d4a44; }
    .status { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
    button.ghost {
      margin-top: .45rem; background: transparent; border: 1px dashed #cfc6b6;
      border-radius: 8px; padding: .4rem .6rem; font: inherit; font-size: .82rem; color: var(--muted); cursor: pointer;
    }
    button.primary {
      margin-top: .55rem; background: var(--fp); color: #f6f3ec; border: 0;
      border-radius: 10px; padding: .7rem 1rem; font: inherit; font-weight: 650; cursor: pointer;
      width: 100%;
    }
    button.primary:disabled { opacity: .6; cursor: wait; }
    #gate { max-width: 420px; margin: 2.5rem auto; }
    #app { display: none; }
    body.is-open #gate { display: none; }
    body.is-open #app { display: block; }
    .err { color: #9b1c1c; font-size: .88rem; margin-top: .45rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="lockup">FreshPoint <b>×</b> Instacart Will Call</div>
      <h1>Delivery cost estimator</h1>
      <p class="lede" id="lede">Enter the password from your Instacart contact to continue.</p>
    </div>
  </header>

  <main id="gate" class="wrap">
    <section class="card">
      <form id="gateForm">
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" required>
        </div>
        <button class="primary" id="unlockBtn" type="submit">Open calculator</button>
        <p class="err" id="gateErr" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div id="app">
    <main class="wrap">
      <div class="grid">
        <section class="card">
          <div class="field">
            <label for="wh">Warehouse</label>
            <select id="wh"></select>
            <p class="hint" id="whMeta"></p>
          </div>
          <div class="field">
            <label for="addr">Customer delivery address</label>
            <input id="addr" type="text" autocomplete="off" placeholder="Street, city, state">
            <div class="suggest" id="suggest" role="listbox"></div>
          </div>
          <div class="field" id="milesManualWrap" hidden>
            <label for="milesManual">Miles</label>
            <input id="milesManual" type="number" min="0" step="0.1" inputmode="decimal">
          </div>
          <button class="ghost" id="toggleManual" type="button">Enter miles yourself</button>
          <p class="status" id="status" aria-live="polite"></p>
          <div id="map" aria-label="Map of warehouse and delivery address"></div>
        </section>
        <section class="card" id="quoteCard">
          <div class="hint" style="margin-top:0">Estimated cost</div>
          <div class="quote-amt" id="total">— <small>USD</small></div>
          <div class="rows" id="breakdown"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="payload.js?v=20260831c"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const SESSION_KEY = "fpQuoteConfigV1";
    const STATUS_LABEL = { live: "Live", launching: "Launching", expansion: "Expansion" };
    const $ = (id) => document.getElementById(id);

    function b64(s) {
      return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    }
    async function deriveKey(password, salt, iter) {
      const base = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }
    async function decryptBlob(password) {
      const blob = window.FP_QUOTE_BLOB;
      const key = await deriveKey(password, b64(blob.salt), blob.iter);
      const raw = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(blob.iv) },
        key,
        b64(blob.data)
      );
      return JSON.parse(new TextDecoder().decode(raw));
    }

    let CONFIG = null;
    let dest = null;
    let lastMiles = null;
    let lastSource = "";
    let map, whMarker, destMarker, line, debounce;

    function warehouses() { return CONFIG.warehouses; }
    function warehouse() {
      return warehouses().find((w) => w.id === $("wh").value);
    }
    function tierFor(w) {
      return CONFIG.tier1States.includes(w.state) ? 1 : 2;
    }
    function rates(tier) {
      return CONFIG.tiers[String(tier)];
    }
    function money(n) {
      return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }
    // Equirectangular (local cartesian) miles — as the crow flies.
    function fliesMiles(a, b) {
      const milesPerDeg = 69.172;
      const latMid = ((a.lat + b.lat) / 2) * Math.PI / 180;
      const dx = (b.lng - a.lng) * Math.cos(latMid) * milesPerDeg;
      const dy = (b.lat - a.lat) * milesPerDeg;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function quote(miles, w) {
      const r = rates(tierFor(w));
      const extraMiles = Math.max(0, miles - 5);
      const extra = extraMiles * r.per;
      return { ...r, miles, extraMiles, extra, total: r.base + extra };
    }
    function renderQuote() {
      const w = warehouse();
      if (lastMiles == null || Number.isNaN(lastMiles)) {
        $("total").innerHTML = "— <small>USD</small>";
        $("breakdown").innerHTML = "";
        return;
      }
      const q = quote(lastMiles, w);
      $("total").innerHTML = `${money(q.total)} <small>USD</small>`;
      const milesLabel = lastSource === "manual" ? "Miles" : "Straight-line miles";
      $("breakdown").innerHTML = `
        <div class="row"><span>Warehouse</span><span>${w.name}</span></div>
        <div class="row"><span>${milesLabel}</span><span>${lastMiles.toFixed(1)} mi</span></div>
        <div class="row"><span>Base</span><span>${money(q.base)}</span></div>
        <div class="row"><span>Additional mileage</span><span>${money(q.extra)}</span></div>
        <div class="row"><span>Estimated cost</span><span>${money(q.total)}</span></div>
      `;
    }
    function updateWhMeta() {
      const w = warehouse();
      $("whMeta").innerHTML = `${w.address} · <span class="pill ${w.status}">${STATUS_LABEL[w.status]}</span>`;
      if (map && whMarker) {
        whMarker.setLatLng([w.lat, w.lng]);
        map.setView([w.lat, w.lng], dest ? map.getZoom() : 10);
      }
      if (dest) measure();
      else renderQuote();
    }
    function initMap() {
      const w = warehouse();
      map = L.map("map", { scrollWheelZoom: false }).setView([w.lat, w.lng], 10);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      whMarker = L.marker([w.lat, w.lng]).addTo(map).bindPopup("Warehouse");
    }
    function drawDest(lat, lng) {
      if (destMarker) destMarker.setLatLng([lat, lng]);
      else destMarker = L.marker([lat, lng]).addTo(map).bindPopup("Customer");
      const w = warehouse();
      if (line) map.removeLayer(line);
      line = L.polyline([[w.lat, w.lng], [lat, lng]], { color: "#0aad0a", weight: 3 }).addTo(map);
      map.fitBounds(line.getBounds().pad(0.2));
    }
    function measure() {
      const w = warehouse();
      if (!dest) return;
      lastMiles = fliesMiles(w, dest);
      lastSource = "flies";
      $("status").textContent = "";
      drawDest(dest.lat, dest.lng);
      renderQuote();
    }
    async function searchAddr(q) {
      if (q.trim().length < 5) { $("suggest").style.display = "none"; return; }
      const params = new URLSearchParams({
        q, format: "json", addressdetails: "0", limit: "5", countrycodes: "us"
      });
      const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
        headers: { Accept: "application/json" }
      });
      const rows = await res.json();
      $("suggest").innerHTML = "";
      if (!rows.length) { $("suggest").style.display = "none"; return; }
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = row.display_name;
        btn.addEventListener("click", () => {
          $("addr").value = row.display_name;
          dest = { lat: parseFloat(row.lat), lng: parseFloat(row.lon) };
          $("suggest").style.display = "none";
          $("milesManualWrap").hidden = true;
          measure();
        });
        $("suggest").appendChild(btn);
      });
      $("suggest").style.display = "block";
    }

    function boot(config) {
      CONFIG = config;
      $("lede").textContent = "Select a warehouse and enter the customer address.";
      const whEl = $("wh");
      whEl.innerHTML = "";
      warehouses().forEach((w) => {
        const opt = document.createElement("option");
        opt.value = w.id;
        opt.textContent = `${w.name} (${STATUS_LABEL[w.status]})`;
        whEl.appendChild(opt);
      });
      document.body.classList.add("is-open");
      whEl.addEventListener("change", updateWhMeta);
      $("addr").addEventListener("input", () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => searchAddr($("addr").value).catch(() => {
          $("status").textContent = "Could not find that address. Enter miles yourself.";
        }), 450);
      });
      document.addEventListener("click", (e) => {
        if (!$("suggest").contains(e.target) && e.target !== $("addr")) $("suggest").style.display = "none";
      });
      $("toggleManual").addEventListener("click", () => {
        $("milesManualWrap").hidden = false;
        $("milesManual").focus();
      });
      $("milesManual").addEventListener("input", () => {
        const n = parseFloat($("milesManual").value);
        if (Number.isNaN(n) || n < 0) return;
        lastMiles = n;
        lastSource = "manual";
        dest = null;
        renderQuote();
      });
      initMap();
      updateWhMeta();
      setTimeout(() => map && map.invalidateSize(), 50);
    }

    async function unlock(password) {
      const config = await decryptBlob(password);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(config));
      boot(config);
    }

    $("gateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("gateErr").textContent = "";
      $("unlockBtn").disabled = true;
      try {
        await unlock($("pw").value);
      } catch (err) {
        $("gateErr").textContent = "That password doesn’t match.";
      } finally {
        $("unlockBtn").disabled = false;
      }
    });

    try {
      const cached = sessionStorage.getItem(SESSION_KEY);
      if (cached) boot(JSON.parse(cached));
    } catch (err) {
      sessionStorage.removeItem(SESSION_KEY);
    }
  </script>
</body>
</html>
